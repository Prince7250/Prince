<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cards</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing:border-box;
        }
        .container{
            width:100vw;
            height:100vh;
            /* min-height:728px; */
            background-color: #8BC6EC;
            background-image: linear-gradient(135deg, #8BC6EC 0%, #9599E2 100%);
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .cards{
                width: 400px;
           height: 600px;
           background-color: white;
           border-radius: 20px;

           display: flex;
           flex-direction:column;
           align-items:center;
           gap: 20px;
           /* padding:20px; */
        }
        .cards img{
            width:400px;
            height: 30%;
            border-top-left-radius: 20px;
            border-top-right-radius:20px;


    
        }
        .textbox{
            display:flex;
            flex-direction:column;
            align-items: center;
            gap:20px;
            width:75%;
            text-align:center;
        }
        #amountbox{
        width: 80%;
        height: 10%;
        background-color:#9599E2;
        border-radius: 5px;
        display: flex;
        justify-content: space-between;
        align-items:center;
        padding-right:20px;
        padding-left:20px;

        }
        #leftbox{
           width:fit-content;
           display: flex;
           gap:15px;
           height:100%;
          align-items:center;

        }
        .imagebox img{
            width:3.4rem;
            height:3.4rem;

        }
        #paymentbutton{
            width:80%;
            height:9%;
            background-color:#2f3437;
            color:white;
            border-radius:5px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.19), 0 6px 6px rgba(0,0,0,0.23);
        }
        .cancelbox a{
           text-decoration:none;
           color:rgb(11, 107, 175);
           font-weight:bold;
           font-size:large;

        }

        .textamount{
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* #textbox amount{
            display:flex; 
            gap:10px;
        } */
        
     
        </style> 
</head>
<body>
    <div class="container">
        <div class="cards">
            <image src="digital.image2.jpg"></image>
            <div class="textbox">
             <h2>Order Summary</h2>
             <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Sapiente reprehenderit maiores nemo voluptas aspernatur assumenda nihil saepe officia earum dolor.</p>

            </div>
            <div id="amountbox">
                <div id="leftbox">
            
                  <div class="imagebox">
                    <image src="music.image.jpg"></image>
                  </div>
                  <div class="textamount">
                    <p>Amount</p>
                    <p>$99.9/year</p>
                  </div>
                </div>

                <div class="rightbox">
                    <a href="#">Change</a>
                </div>


            </div>
            <button id="paymentbutton">
                  proceed payment
            </button>

            <div class="cancelbox">
                <a href="#"> Cancel Order</a>
            </div>
           
        </div>

    </div>
</body>
</html>
